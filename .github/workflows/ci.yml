name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + train/dev deps
        # The bare install is serving-only (that list is what the deployment
        # ships); the tests exercise the training pipeline, so they need [train].
        run: pip install -e ".[train,dev]"

      - name: Run tests
        run: pytest -q
